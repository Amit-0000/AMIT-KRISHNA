name: QA Suite

# Validation, vulnerability (DAST), unit, load, and E2E (Selenium desktop +
# Appium mobile-web) testing for VoiceGuard, consolidated into one Excel
# report artifact. Complements backend.yml/frontend.yml/docker.yml (which
# gate merges) — this workflow is the full release-readiness sweep.
#
# Jobs: setup-node -> {selenium-tests, appium-tests, load-tests,
# security-assessment} -> summary, plus an independent unit-tests job.
# Both selenium-tests and appium-tests gate on a real, configurable
# pass-rate threshold each (see their own job comments and each suite's
# check_pass_threshold.py) and are included in summary's pass/fail gate
# like every other blocking job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: voiceguard

jobs:
  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceguard/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voiceguard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Upload web build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: voiceguard/frontend/dist
          retention-days: 30
          if-no-files-found: warn

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            voiceguard/api/requirements.txt
            voiceguard/api/requirements-ml.txt

      - name: Install backend + ML dependencies
        run: |
          pip install --no-cache-dir -r api/requirements.txt
          pip install --no-cache-dir -r api/requirements-ml.txt

      - name: Run pytest suite
        working-directory: voiceguard/api
        env:
          PYTHONPATH: ${{ github.workspace }}/voiceguard
        run: |
          python -m pytest -v \
            --json-report --json-report-file="${{ github.workspace }}/automated_test/unit_test_report.json" \
            --junitxml="${{ github.workspace }}/automated_test/unit_test_report.xml"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            automated_test/unit_test_report.json
            automated_test/unit_test_report.xml
          retention-days: 30
          if-no-files-found: warn

  security-assessment:
    name: security-assessment
    runs-on: ubuntu-latest
    needs: [setup-node]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bring up postgres/redis/backend
        run: docker compose up -d --build postgres redis backend
        env:
          DOCKER_BUILDKIT: "1"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time"; exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automated_test/requirements.txt

      - name: Install DAST suite dependencies
        working-directory: automated_test
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run DAST pipeline
        working-directory: automated_test
        run: python run_all.py

      - name: Trivy filesystem scan (dependency CVEs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: voiceguard
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Build backend image for container scan
        run: docker build -f api/Dockerfile.ml -t voiceguard-backend:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voiceguard-backend:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend --tail 300

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            automated_test/report.json
            automated_test/results/
            trivy-fs-results.sarif
            trivy-image-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v

  load-tests:
    name: load-tests
    runs-on: ubuntu-latest
    needs: [setup-node]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voiceguard/performance/requirements.txt

      - name: Install load-test tooling dependencies
        run: pip install --no-cache-dir -r performance/requirements.txt

      - name: Bring up stack with loosened login rate limit
        run: docker compose -f docker-compose.yml -f performance/docker-compose.loadtest.yml up -d --build postgres redis backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time"; exit 1

      - name: Seed load-test users
        run: |
          docker cp performance/seed_users.py voiceguard-backend-1:/app/seed_users.py
          docker compose exec -T backend python seed_users.py 120

      - name: Run k6 baseline load test
        # grafana/k6 runs as a non-root user by default, which can't write
        # into a runner-owned bind mount — run as the runner's own uid/gid
        # so /scripts is writable. summary_new.json comes from the script's
        # handleSummary() (which takes precedence over --summary-export, so
        # that flag is intentionally omitted here).
        run: |
          docker run --rm --network voiceguard_default \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/voiceguard/performance/k6:/scripts" \
            -e BASE_URL=http://backend:8000 \
            grafana/k6:latest run /scripts/baseline_load_test.js \
            --out json=/scripts/raw_metrics_new.json

      - name: Parse results
        # handleSummary() in baseline_load_test.js writes its output
        # unconditionally on exit, even when k6 exits 99 for a crossed
        # threshold — so this step (and the report build below) must run
        # on always() too, otherwise a threshold failure silently leaves
        # the previous run's committed report/artifact files in place and
        # the uploaded "results" are stale, not from this run.
        if: always()
        run: |
          cp performance/k6/raw_metrics_new.json performance/results/raw_metrics.json
          cp performance/k6/summary_new.json performance/results/summary.json
          python performance/parse_results.py

      - name: Build load-test Excel artifact
        if: always()
        run: python performance/build_excel.py

      - name: Upload load-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-report
          path: |
            voiceguard/performance/baseline_results.json
            voiceguard/performance/baseline_results.csv
            voiceguard/performance/baseline_report.md
            voiceguard/performance/VoiceGuard_Baseline_Load_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v

  selenium-tests:
    name: selenium-tests
    runs-on: ubuntu-latest
    needs: [setup-node]
    # Gates on a real, configurable pass-rate threshold (see
    # check_pass_threshold.py), same pattern as appium-tests: only the
    # pytest-run step tolerates a non-zero exit (step-level continue-on-error,
    # so a handful of failing/flaky tests among 400+ don't abort the run
    # before the threshold check, report, and artifact steps get to run) —
    # genuine infra failures (no report produced at all) and a pass rate
    # under threshold both still fail this job for real.
    env:
      # Configurable pass-rate bar for this job's real gate. Skipped tests
      # count toward the denominator, never toward "passed".
      SELENIUM_MIN_PASS_RATE: "90"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bring up full stack
        run: docker compose up -d --build postgres redis backend frontend

      - name: Wait for frontend + backend health
        run: |
          for i in $(seq 1 60); do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            f=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173 || true)
            if [ "$b" = "200" ] && [ "$f" = "200" ]; then echo "stack healthy"; exit 0; fi
            sleep 2
          done
          echo "stack did not become healthy in time"; exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            automated_test/requirements.txt
            voiceguard/e2e/requirements.txt

      - name: Install DAST fixture-provisioning dependencies
        working-directory: automated_test
        run: pip install --no-cache-dir -r requirements.txt

      - name: Provision the DAST fixture account used by Selenium's login test
        working-directory: automated_test
        run: python setup_env.py

      - name: Install Selenium suite dependencies
        run: pip install --no-cache-dir -r e2e/requirements.txt

      - name: Run Selenium suite (headless Chrome)
        # --reruns 2 (bumped from 1, 2026-08-12): the suite grew from ~139
        # to 400+ tests sharing one long-lived headless Chrome session
        # (conftest.py's session-scoped `driver` — see its docstring for
        # why one shared session is deliberate, not accidental). At this
        # size, real verification runs showed occasional single-test
        # failures (a stale element reference or a transient timing race)
        # that shift between runs and pass in isolation — genuine
        # non-deterministic single-session flakiness at roughly 1-2%, not a
        # deterministic bug in any specific test (every reproducible bug
        # found during that verification was fixed in the test/page-object
        # code itself, not papered over here). --reruns 2 remains a bounded,
        # test-level retry for transient WebDriver-level flakiness — it is
        # not what decides this job's pass/fail; "Apply Selenium pass-rate
        # threshold" below is.
        working-directory: voiceguard/e2e/selenium
        run: |
          python -m pytest -v --reruns 2 --reruns-delay 3 \
            --json-report --json-report-file="${{ github.workspace }}/voiceguard/e2e/results/selenium_report.json" \
            --junitxml="${{ github.workspace }}/voiceguard/e2e/results/selenium_report.xml"
        # Step-level only: a handful of failing/flaky tests among 400+ must
        # not abort the run before the threshold check, report, and
        # artifact-upload steps below get to run. This does NOT hide the
        # job's real result — "Apply Selenium pass-rate threshold" below is
        # what actually decides whether this job succeeds, and a genuine
        # infra failure (no report produced at all) still fails it.
        continue-on-error: true

      - name: Parse Selenium results
        # Same always()-must-run reasoning as appium-tests' identical step:
        # pytest-json-report writes selenium_report.json unconditionally
        # (including on failures), so this step and the reports below must
        # run even when the suite above didn't fully pass.
        if: always()
        working-directory: voiceguard/e2e/selenium
        run: python parse_results.py

      - name: Build Selenium HTML report
        if: always()
        working-directory: voiceguard/e2e/selenium
        run: python build_html_report.py

      - name: Build Selenium Excel reports
        if: always()
        working-directory: voiceguard/e2e/selenium
        run: python build_excel.py

      - name: Build JSON/Markdown deliverables
        # execution-results.json is a plain copy of selenium_summary.json
        # under the deliverable-spec's requested name (parse_results.py
        # already produces the real data; this just also exposes it under
        # that name for the artifact bundle). summary.md is the same
        # Markdown table report_summary_markdown.py already prints to
        # $GITHUB_STEP_SUMMARY in the `summary` job below, saved as a real
        # file here too so it travels with the rest of this run's
        # deliverables rather than living only in the Job Summary UI.
        if: always()
        working-directory: voiceguard/e2e/selenium
        run: |
          cp ../results/selenium_summary.json ../results/execution-results.json || true
          python ../appium/report_summary_markdown.py ../results/selenium_summary.json \
            "Selenium (Web E2E)" "see selenium-tests job's own summary for the real pass-rate gate result" \
            > ../results/summary.md || true

      - name: Apply Selenium pass-rate threshold
        # The job's real gate (see the job-level comment above): writes the
        # Selenium Web E2E Test Summary table to the Actions summary and
        # exits non-zero when no report was produced, zero tests ran, or
        # the pass rate (passed / (passed + failed + skipped)) is below
        # SELENIUM_MIN_PASS_RATE. This step's exit code is what actually
        # determines this job's pass/fail.
        if: always()
        working-directory: voiceguard/e2e/selenium
        run: python check_pass_threshold.py

      - name: Upload Selenium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-report
          path: |
            voiceguard/e2e/results/selenium_report.*
            voiceguard/e2e/results/selenium_summary.json
            voiceguard/e2e/results/execution-results.json
            voiceguard/e2e/results/summary.md
            voiceguard/e2e/results/execution-report.html
            voiceguard/e2e/results/Automation_Test_Report.xlsx
            voiceguard/e2e/results/Passed_Test_Cases.xlsx
            voiceguard/e2e/results/Failed_Test_Cases.xlsx
            voiceguard/e2e/results/Summary_Report.xlsx
            voiceguard/e2e/results/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v

  appium-tests:
    name: appium-tests
    runs-on: ubuntu-latest
    needs: [setup-node]
    # Real-world runs of this job have gone silent for 2+ hours inside the
    # emulator-runner step with none of that step's own internal timeouts
    # (boot timeout, instrumentation-launch timeout, adb_exec_timeout) ever
    # firing — a genuine runner/KVM-level hang, not a slow-but-progressing
    # run. Left unbounded, the default 360-minute GitHub Actions job timeout
    # is the only thing that would eventually end it. A tight job-level cap
    # turns that into a fast, honest failure instead: check_pass_threshold.py
    # below still runs (if: always()) and reports it as the real infra
    # failure it is, rather than the workflow looking "still running" for
    # hours.
    timeout-minutes: 55
    # The app has no native mobile client — this covers the responsive/
    # mobile-viewport UI path only, via mobile Chrome under UiAutomator2.
    #
    # This job used to carry a job-level continue-on-error: true, which hid
    # its real result behind a green checkmark regardless of outcome. Every
    # root cause behind its past flakiness (cold KVM boot timing, redundant
    # UiAutomator2 session creation, an under-sized instrumentation-launch
    # timeout, a broken chromedriverAutodownload pairing, and system-server
    # startup ordering under CPU contention) has since been fixed — AVD
    # snapshot caching, the session-scoped driver fixture, the 300s
    # instrumentation timeouts, the pinned legacy chromedriver, and the
    # `service check settings` wait loop below, respectively. The job now
    # gates on a real, configurable pass-rate threshold instead
    # (APPIUM_MIN_PASS_RATE below, applied by check_pass_threshold.py as the
    # job's actual last word): only the individual pytest-run step tolerates
    # a non-zero exit (continue-on-error at the *step* level, so a handful
    # of failing/flaky tests don't abort the run before the threshold check
    # and report/artifact steps get to run) — genuine infra failures (no
    # report produced at all) and a pass rate under threshold both make this
    # job fail for real, same as any other job in this workflow.
    env:
      # Configurable pass-rate bar for this job's real gate (see
      # check_pass_threshold.py). Executable tests only (excludes skips).
      APPIUM_MIN_PASS_RATE: "90"
    steps:
      - uses: actions/checkout@v7

      # This runner's default udev rules don't grant the `runner` user
      # access to /dev/kvm ("ProbeKVM: This user doesn't have permissions to
      # use KVM"), confirmed via a real run's raw emulator log — so every
      # x86_64 emulator boot here has actually been running with hardware
      # acceleration force-disabled (`-accel off`, "disable-linux-hw-accel:
      # auto" resolving to true) this whole time: pure software CPU
      # emulation, not KVM-backed virtualization. That's the real root cause
      # behind every "slow/flaky under CI contention" symptom documented
      # below and in this suite's README (cold boot minutes, session
      # creation minutes, instrumentation timeouts) — those fixes worked
      # around software-emulation-level slowness, not CPU contention per se.
      # This is the standard fix documented by reactivecircus/android-
      # emulator-runner itself for Linux runners: relax the kvm device's
      # udev permissions so the actual hardware acceleration GitHub-hosted
      # Linux runners provide gets used.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # A cold KVM emulator boot (no cached snapshot) took 10+ minutes on
      # GitHub-hosted runners, racing the UiAutomator2 instrumentation
      # bring-up against CPU/RAM contention from the Docker stack below and
      # causing transient session-creation failures ("Can't find service:
      # settings", instrumentation timeout). Caching the AVD snapshot and
      # warming it up *before* the Docker stack starts (so the one-time cold
      # boot isn't competing with postgres/redis/backend/frontend for CPU)
      # gets subsequent boots down to ~30s. This is the pattern documented
      # by reactivecircus/android-emulator-runner itself.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64-pixel_5-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          # A cold KVM boot with no cache has been observed anywhere from
          # ~10 to >14 minutes on GitHub-hosted runners (nested
          # virtualization is inherently variable there) — the action's
          # 600s default cut off a boot that was still in progress. This
          # step only ever runs once per cache key, so give it real room.
          emulator-boot-timeout: 1200
          script: echo "Generated AVD snapshot for caching."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Bring up full stack
        run: docker compose up -d --build postgres redis backend frontend

      - name: Wait for frontend + backend health
        run: |
          for i in $(seq 1 60); do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            f=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173 || true)
            if [ "$b" = "200" ] && [ "$f" = "200" ]; then echo "stack healthy"; exit 0; fi
            sleep 2
          done
          echo "stack did not become healthy in time"; exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            automated_test/requirements.txt
            voiceguard/e2e/requirements.txt

      - name: Install DAST fixture-provisioning dependencies
        working-directory: automated_test
        run: pip install --no-cache-dir -r requirements.txt

      - name: Provision the DAST fixture account used by Appium's login test
        working-directory: automated_test
        run: python setup_env.py

      - name: Install Appium suite dependencies
        run: |
          pip install --no-cache-dir -r e2e/requirements.txt
          npm install -g appium@3.6.0
          appium driver install uiautomator2@8.2.2

      - name: Install matching Chromedriver for the emulator's stock Chrome
        # Appium's chromedriverAutodownload capability only resolves
        # against the newer Chrome-for-Testing endpoint, which has no
        # entries before Chrome 115 -- and the api-level 33 google_apis
        # image ships a stock Chrome 109.0.5414, so autodownload silently
        # finds nothing and every test fails with "No Chromedriver found".
        # A matching driver does exist, just on the legacy
        # chromedriver.storage.googleapis.com endpoint -- fetch it
        # explicitly and point Appium straight at it instead.
        run: |
          curl -sL -o "${{ github.workspace }}/chromedriver-109.zip" https://chromedriver.storage.googleapis.com/109.0.5414.74/chromedriver_linux64.zip
          unzip -o "${{ github.workspace }}/chromedriver-109.zip" -d "${{ github.workspace }}/chromedriver-109"
          chmod +x "${{ github.workspace }}/chromedriver-109/chromedriver"

      - name: Start Appium server
        run: |
          nohup appium --base-path /wd/hub --log-timestamp > "${{ github.workspace }}/appium.log" 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/wd/hub/status >/dev/null && { echo "appium server up"; exit 0; }
            sleep 2
          done
          echo "appium server did not start in time"; cat "${{ github.workspace }}/appium.log"; exit 1

      - name: Run Appium mobile-web suite on Android emulator
        # Bounded independently of the job-level timeout-minutes above so a
        # hang here (the observed failure mode before the KVM-acceleration
        # fix) still leaves headroom for Parse/Build/Threshold-check/Upload/
        # Tear down to run afterward instead of the whole job timing out
        # mid-suite with nothing salvaged. 35 min, not 25: a real post-fix
        # run reached 83% of the suite (98/118 tests, each now taking
        # seconds instead of minutes) inside the previous 25-minute budget
        # before being cut off — genuinely still executing, just needed a
        # little more headroom for reruns' extra pass, not hung.
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # android-emulator-runner's `script` input is split on newlines and
          # each line is run as its own independent shell invocation (see
          # its script-parser.ts), so a `cd` on one line and a `\`-continued
          # command on the next don't share state — everything must be one
          # self-contained line. The `service check settings` loop guards
          # against the system server's SettingsProvider still coming up
          # after `sys.boot_completed=1`, which otherwise makes the very
          # first Appium session's hidden-api-policy reset fail with
          # "Can't find service: settings".
          # --reruns 1: retries a failing test once (2 attempts total,
          # test-level flake tolerance for the mobile suite itself) —
          # separate from and in addition to the emulator/session-level
          # retries already in conftest.py's driver fixture.
          script: for i in $(seq 1 30); do adb shell service check settings 2>/dev/null | grep -q "found" && break; sleep 2; done; cd "${{ github.workspace }}/voiceguard/e2e/appium" && python -m pytest -v --reruns 1 --reruns-delay 3 --json-report --json-report-file="${{ github.workspace }}/voiceguard/e2e/results/appium_report.json" --junitxml="${{ github.workspace }}/voiceguard/e2e/results/appium_report.xml"
        env:
          APPIUM_SERVER_URL: http://127.0.0.1:4723/wd/hub
          APPIUM_BASE_URL: http://10.0.2.2:5173
          CHROMEDRIVER_EXECUTABLE: ${{ github.workspace }}/chromedriver-109/chromedriver
        # Step-level only: a handful of failing/flaky tests must not abort
        # the run before the threshold check, report, and artifact-upload
        # steps below get to run. This does NOT hide the job's real result —
        # "Apply Appium pass-rate threshold" below is what actually decides
        # whether this job succeeds, and a genuine infra failure (no report
        # produced at all) still fails it. See the job-level comment above.
        continue-on-error: true

      - name: Parse Appium results
        # Same always()-must-run reasoning already documented on load-tests'
        # "Parse results" step: pytest-json-report writes appium_report.json
        # unconditionally (including on test failures), so this step (and
        # the HTML report below) must run even when the suite above didn't
        # fully pass — otherwise a failure run silently ships a stale or
        # missing summary/report instead of this run's real numbers. These
        # env values are the same api-level/target/arch/profile and
        # appium/uiautomator2/chromedriver versions pinned earlier in this
        # job — kept here too so the report's "Environment" section reflects
        # this job's actual config instead of parse_results.py's fallback
        # defaults silently drifting from it.
        if: always()
        working-directory: voiceguard/e2e/appium
        env:
          ANDROID_API_LEVEL: "33"
          ANDROID_TARGET: google_apis
          ANDROID_ARCH: x86_64
          ANDROID_PROFILE: pixel_5
          APPIUM_VERSION: "3.6.0"
          UIAUTOMATOR2_DRIVER_VERSION: "8.2.2"
          EMULATOR_CHROME_VERSION: "109.0.5414"
          CHROMEDRIVER_VERSION: "109.0.5414.74"
        run: python parse_results.py

      - name: Build Appium HTML report
        if: always()
        working-directory: voiceguard/e2e/appium
        run: python build_html_report.py

      - name: Apply Appium pass-rate threshold
        # The job's real gate (see the job-level comment above): writes the
        # Appium Mobile Web Test Summary table to the Actions summary and
        # exits non-zero when no report was produced, zero tests executed,
        # or the pass rate among executed tests is below
        # APPIUM_MIN_PASS_RATE. This step's exit code is what actually
        # determines this job's pass/fail — nothing upstream is
        # continue-on-error at the job level anymore.
        if: always()
        working-directory: voiceguard/e2e/appium
        run: python check_pass_threshold.py

      - name: Upload Appium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-report
          path: |
            voiceguard/e2e/results/appium_report.*
            voiceguard/e2e/results/appium_summary.json
            voiceguard/e2e/results/execution-report.html
            voiceguard/e2e/results/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy-qa-reports:
    name: deploy-qa-reports
    runs-on: ubuntu-latest
    needs: [appium-tests, selenium-tests]
    # Publishing this run's reports must never be why the pipeline goes red,
    # and must still be attempted even when appium-tests/selenium-tests
    # failed/errored (if: always()), since a failure run's report is exactly
    # the one worth looking at. Both appium-tests and selenium-tests still
    # gate the pipeline normally on their own real results (see their jobs
    # and the `summary` job's final gate) — only *this publishing job* is
    # non-blocking.
    if: always()
    continue-on-error: true
    # pages/id-token: required by actions/deploy-pages. contents: write:
    # this job also pushes the gh-pages branch itself (see "Merge into
    # persistent gh-pages history store" below) — this repo's Pages source
    # is the GitHub-Actions-native "workflow" build type (confirmed via
    # `gh api repos/<owner>/<repo>/pages`), not the classic "deploy from a
    # branch" mode, so gh-pages here is kept purely as a git-backed store
    # for reports/history/build-N/ across runs, not what Pages serves from
    # directly.
    permissions:
      contents: write
      pages: write
      id-token: write
    # Overrides the workflow-level `defaults.run.working-directory: voiceguard`
    # back to the repo root — same reason and same override the `summary`
    # job below already uses: this job's own paths are voiceguard/-prefixed
    # (voiceguard/e2e/..., voiceguard/publish/...), which would otherwise
    # resolve to voiceguard/voiceguard/... under the workflow default.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Download Appium report artifact
        uses: actions/download-artifact@v8
        with:
          name: appium-report
          path: artifacts/appium

      - name: Download Selenium report artifact
        uses: actions/download-artifact@v8
        with:
          name: selenium-report
          path: artifacts/selenium

      - name: Assemble this run's report content
        # reports/latest/ (Appium) and reports/selenium/latest/ (Selenium)
        # are each meant to be overwritten every run; their history/build-N/
        # siblings are unique per run — both suites' trees get merged into
        # the persistent gh-pages store in the next step, which is what
        # actually gives "latest + history" real persistence across runs
        # under this repo's workflow-based Pages deployment (a single
        # deploy-pages call fully replaces the live site from whatever
        # artifact it's given, so that artifact has to already contain the
        # accumulated history, not just this run's output). Downloaded to
        # separate artifacts/appium and artifacts/selenium dirs above since
        # both suites produce a same-named execution-report.html — merging
        # them into one download path would clobber one with the other.
        run: |
          set -e
          BUILD=${{ github.run_number }}

          mkdir -p voiceguard/publish/reports/latest voiceguard/publish/reports/history/build-$BUILD
          for f in appium_summary.json execution-report.html; do
            if [ -f "artifacts/appium/$f" ]; then
              cp "artifacts/appium/$f" voiceguard/publish/reports/latest/
              cp "artifacts/appium/$f" voiceguard/publish/reports/history/build-$BUILD/
            fi
          done
          if [ -d artifacts/appium/screenshots ]; then
            cp -r artifacts/appium/screenshots voiceguard/publish/reports/latest/
            cp -r artifacts/appium/screenshots voiceguard/publish/reports/history/build-$BUILD/
          fi
          cp voiceguard/e2e/appium/trends.html voiceguard/publish/reports/latest/

          mkdir -p voiceguard/publish/reports/selenium/latest voiceguard/publish/reports/selenium/history/build-$BUILD
          for f in selenium_summary.json execution-report.html Automation_Test_Report.xlsx \
                   Passed_Test_Cases.xlsx Failed_Test_Cases.xlsx Summary_Report.xlsx \
                   execution-results.json summary.md; do
            if [ -f "artifacts/selenium/$f" ]; then
              cp "artifacts/selenium/$f" voiceguard/publish/reports/selenium/latest/
              cp "artifacts/selenium/$f" voiceguard/publish/reports/selenium/history/build-$BUILD/
            fi
          done
          if [ -d artifacts/selenium/screenshots ]; then
            cp -r artifacts/selenium/screenshots voiceguard/publish/reports/selenium/latest/
            cp -r artifacts/selenium/screenshots voiceguard/publish/reports/selenium/history/build-$BUILD/
          fi
          cp voiceguard/e2e/selenium/trends.html voiceguard/publish/reports/selenium/latest/

          echo "--- publish tree ---"
          find voiceguard/publish -type f

      - name: Merge into persistent gh-pages history store and push
        # This repo's Pages source is build_type "workflow" (GitHub-Actions-
        # native deployment via actions/deploy-pages below), which fully
        # replaces the live site from a single uploaded artifact on every
        # deploy — there's no branch-source "keep existing files" behavior
        # to lean on. gh-pages is kept anyway, purely as a real git-backed
        # store for both suites' reports/**/history/build-N/ across runs
        # (arguably better than a plain-file "keep_files" merge, since it's
        # actual version history): clone it if it exists, start a fresh
        # orphan branch if this is the first-ever run, copy this run's new
        # content in on top of whatever's already there, update both
        # suites' history manifests, commit, and push. The resulting
        # working tree is what gets uploaded as the Pages artifact below.
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 "$REPO_URL" gh-pages-store
          else
            mkdir gh-pages-store
            (cd gh-pages-store && git init -b gh-pages)
          fi

          BUILD=${{ github.run_number }}

          mkdir -p gh-pages-store/reports/history
          rm -rf gh-pages-store/reports/latest
          cp -r voiceguard/publish/reports/latest gh-pages-store/reports/latest
          cp -r "voiceguard/publish/reports/history/build-$BUILD" gh-pages-store/reports/history/
          python3 voiceguard/e2e/appium/update_history_manifest.py \
            "$BUILD" gh-pages-store/reports/history/index.json gh-pages-store/reports/history/index.json

          mkdir -p gh-pages-store/reports/selenium/history
          rm -rf gh-pages-store/reports/selenium/latest
          cp -r voiceguard/publish/reports/selenium/latest gh-pages-store/reports/selenium/latest
          cp -r "voiceguard/publish/reports/selenium/history/build-$BUILD" gh-pages-store/reports/selenium/history/
          python3 voiceguard/e2e/appium/update_history_manifest.py \
            "$BUILD" gh-pages-store/reports/selenium/history/index.json gh-pages-store/reports/selenium/history/index.json

          cd gh-pages-store
          git add -A
          git commit -m "Publish Appium + Selenium reports for run $BUILD" --allow-empty
          git push "$REPO_URL" HEAD:gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # gh-pages-store is created at the repo root by the previous step
          # (that step runs with this job's working-directory: . override),
          # not under voiceguard/ — and `with.path` here is resolved from
          # github.workspace regardless of any working-directory default,
          # same as every other `uses:` step's `with:` in this workflow.
          path: gh-pages-store

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [setup-node, unit-tests, security-assessment, load-tests, selenium-tests, appium-tests]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report job statuses
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| setup-node | ${{ needs.setup-node.result }} |"
            echo "| unit-tests | ${{ needs.unit-tests.result }} |"
            echo "| selenium-tests | ${{ needs.selenium-tests.result }} |"
            echo "| appium-tests | ${{ needs.appium-tests.result }} |"
            echo "| load-tests | ${{ needs.load-tests.result }} |"
            echo "| security-assessment | ${{ needs.security-assessment.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voiceguard/reports/requirements.txt

      - name: Install report-builder dependencies
        run: pip install --no-cache-dir -r voiceguard/reports/requirements.txt

      - name: Download all test artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble artifacts into expected report-builder layout
        # actions/download-artifact preserves whatever path structure each
        # producing job's upload-artifact step happened to record, which
        # isn't worth hard-coding here — find each expected file by name
        # instead of guessing its nested path.
        run: |
          mkdir -p automated_test/results voiceguard/performance voiceguard/e2e/results
          find artifacts -name unit_test_report.json -exec cp {} automated_test/ \;
          find artifacts/security-report -name report.json -exec cp {} automated_test/ \;
          find artifacts/security-report -path "*/results/*.json" -exec cp {} automated_test/results/ \;
          find artifacts -name baseline_results.json -exec cp {} voiceguard/performance/ \;
          find artifacts -name selenium_report.json -exec cp {} voiceguard/e2e/results/ \;
          find artifacts -name selenium_summary.json -exec cp {} voiceguard/e2e/results/ \; || true
          find artifacts -name appium_report.json -exec cp {} voiceguard/e2e/results/ \; || true
          find artifacts -name appium_summary.json -exec cp {} voiceguard/e2e/results/ \; || true
          echo "--- assembled tree ---"
          find automated_test voiceguard/performance voiceguard/e2e/results -type f

      - name: Report Appium execution numbers
        # Real numbers pulled from this run's own appium_summary.json (the
        # artifact appium-tests' "Parse Appium results" step produced) —
        # not a re-derivation or estimate. appium-tests' own "Apply Appium
        # pass-rate threshold" step already wrote the authoritative
        # Appium Mobile Web Test Summary table (with the real PASS/FAIL
        # verdict against APPIUM_MIN_PASS_RATE) to that job's own step
        # summary; this is a secondary, informational restatement here
        # alongside Selenium's for a single consolidated view, not the
        # thing that decides appium-tests' result.
        if: always()
        run: |
          SUMMARY=voiceguard/e2e/results/appium_summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "### Appium (Mobile Web)" >> "$GITHUB_STEP_SUMMARY"
            echo "No appium_summary.json artifact found for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 voiceguard/e2e/appium/report_summary_markdown.py "$SUMMARY" \
            "Appium (Mobile Web)" "see appium-tests job's own summary for the real pass-rate gate result" >> "$GITHUB_STEP_SUMMARY"

      - name: Report Selenium execution numbers
        # Same real-numbers-only approach as the Appium step above, from
        # selenium-tests' own selenium_summary.json. selenium-tests' own
        # "Apply Selenium pass-rate threshold" step already wrote the
        # authoritative Selenium Web E2E Test Summary table (with the real
        # PASS/FAIL verdict against SELENIUM_MIN_PASS_RATE) to that job's
        # own step summary; this is a secondary, informational restatement
        # here alongside Appium's for a single consolidated view.
        if: always()
        run: |
          SUMMARY=voiceguard/e2e/results/selenium_summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "### Selenium (Web E2E)" >> "$GITHUB_STEP_SUMMARY"
            echo "No selenium_summary.json artifact found for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 voiceguard/e2e/appium/report_summary_markdown.py "$SUMMARY" \
            "Selenium (Web E2E)" "see selenium-tests job's own summary for the real pass-rate gate result" >> "$GITHUB_STEP_SUMMARY"

      - name: Build master Excel report
        run: python voiceguard/reports/build_master_test_report.py

      - name: Upload master report
        uses: actions/upload-artifact@v7
        with:
          name: VoiceGuard_App_Testing_Report
          path: voiceguard/reports/VoiceGuard_App_Testing_Report.xlsx
          retention-days: 90

      - name: Fail summary if a blocking job did not succeed
        # appium-tests now gates like every other job here — its own result
        # already reflects the real pass-rate-threshold outcome (see its
        # job comment and check_pass_threshold.py), not a masked
        # continue-on-error success.
        if: |
          needs.setup-node.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.selenium-tests.result != 'success' ||
          needs.load-tests.result != 'success' ||
          needs.security-assessment.result != 'success' ||
          needs.appium-tests.result != 'success'
        run: |
          echo "One or more blocking QA jobs did not succeed — see the status table above."
          exit 1
