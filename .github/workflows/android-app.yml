name: Android App

# Builds the Capacitor Android wrapper around the existing VoiceGuard
# frontend, runs the native-app Appium suite (voiceguard/e2e/appium-android)
# against a debug build pointed at an isolated local backend, and uploads a
# separate production-pointed debug APK as the downloadable artifact — never
# the CI-only build, which talks to 10.0.2.2 (see build-apk-for-testing
# below), gets handed to anyone. Sibling to qa-suite.yml (web + mobile-web
# Selenium/Appium); this workflow is Android-specific and does not replace
# or modify that one.
#
# Jobs: build-frontend -> build-apk-for-artifact (production API, uploaded)
#                       -> build-apk-for-testing (local docker backend)
#                          -> appium-android-tests (real emulator + real gate)
#       -> summary

on:
  push:
    branches: [main]
    paths:
      - "voiceguard/frontend/**"
      - "voiceguard/e2e/appium-android/**"
      - "voiceguard/api/auth/**"
      - "voiceguard/api/core/deps.py"
      - ".github/workflows/android-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "voiceguard/frontend/**"
      - "voiceguard/e2e/appium-android/**"
      - "voiceguard/api/auth/**"
      - "voiceguard/api/core/deps.py"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: voiceguard

jobs:
  build-apk-for-artifact:
    name: build-apk-for-artifact (production API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voiceguard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: voiceguard/frontend
        run: npm ci

      - name: Build frontend against the production Railway API
        # No VITE_API_BASE_URL override -> frontend/src/services/api.ts's
        # isNativeApp branch falls back to the real production backend
        # (never localhost/10.0.2.2 in a build anyone outside CI receives —
        # Phase 3's requirement).
        working-directory: voiceguard/frontend
        run: npm run build

      - name: Capacitor sync
        working-directory: voiceguard/frontend
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        working-directory: voiceguard/frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: voiceguard/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: voiceguard-debug-apk
          path: voiceguard/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  appium-android-tests:
    name: appium-android-tests
    runs-on: ubuntu-latest
    # Bounded for the same reason qa-suite.yml's appium-tests job documents:
    # a KVM/instrumentation-level hang here has, historically, gone silent
    # for hours with no internal timeout ever firing. A tight cap turns that
    # into a fast, honest failure instead of an apparently-still-running job.
    timeout-minutes: 60
    env:
      # Configurable pass-rate bar for this job's real gate (see
      # check_pass_threshold.py). Independent of qa-suite.yml's
      # APPIUM_MIN_PASS_RATE (mobile-web) — this is a smaller, newer suite
      # covering what the native shell adds (see e2e/appium-android/tests'
      # module docstring), not a port of the ~100+-test mobile-web suite.
      APPIUM_ANDROID_MIN_PASS_RATE: "90"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voiceguard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: voiceguard/frontend
        run: npm ci

      - name: Build frontend against the isolated CI backend
        # 10.0.2.2 is the Android emulator's alias for the CI runner's own
        # localhost (same alias voiceguard/e2e/appium/conftest.py already
        # uses for the mobile-web suite) — this build is for the Appium job
        # only, talks to the docker-compose stack started below, and is
        # never uploaded anywhere a person could install it (see
        # build-apk-for-artifact above for the build that is).
        working-directory: voiceguard/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://10.0.2.2:8000

      - name: Capacitor sync
        working-directory: voiceguard/frontend
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        working-directory: voiceguard/frontend/android
        run: chmod +x gradlew

      - name: Build debug APK (CI backend)
        # http://10.0.2.2:8000 is plain HTTP — reachable here because
        # android/app/src/debug/AndroidManifest.xml (committed, debug-build-
        # type-only) exempts cleartext traffic. See ANDROID_APP.md.
        working-directory: voiceguard/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      # --- Emulator setup: same proven pattern as qa-suite.yml's
      # appium-tests job (KVM perms, cached AVD snapshot) — see that job's
      # comments for the full reasoning. Reused verbatim rather than
      # re-derived.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64-pixel_5-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          emulator-boot-timeout: 1200
          script: echo "Generated AVD snapshot for caching."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Provision the real LCNN checkpoint for this job's backend
        # checkpoints/ is gitignored on purpose (large binary, meant to be
        # mounted at runtime, not committed -- see .gitignore) and no CI job
        # in this repo has ever provisioned one, so every scan through this
        # job's local backend has always genuinely failed with "No active
        # model version available" (confirmed via a real CI run's failure
        # screenshot). This specific checkpoint is small (2.8MB) and is
        # committed as a test fixture at e2e/appium-android/fixtures/ for
        # exactly this purpose -- copied into the real (still-gitignored)
        # checkpoints/ path docker-compose.yml mounts read-only into the
        # backend container, so appium-android-tests can exercise a real
        # completed inference instead of only ever hitting the model's
        # absence.
        working-directory: voiceguard
        run: |
          mkdir -p checkpoints
          cp e2e/appium-android/fixtures/lcnn-ci-checkpoint.pt checkpoints/best.pt

      - name: Bring up isolated backend (postgres, redis, backend only)
        working-directory: voiceguard
        run: docker compose up -d --build postgres redis backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time"; exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            automated_test/requirements.txt
            voiceguard/e2e/requirements.txt

      - name: Install DAST fixture-provisioning dependencies
        working-directory: automated_test
        run: pip install --no-cache-dir -r requirements.txt

      - name: Provision the DAST fixture account used by this suite's login
        working-directory: automated_test
        run: python setup_env.py

      - name: Install Appium suite dependencies
        working-directory: voiceguard
        run: |
          pip install --no-cache-dir -r e2e/requirements.txt
          npm install -g appium@3.6.0
          appium driver install uiautomator2@8.2.2

      - name: Install matching Chromedriver for the emulator's stock Chrome
        # Same real problem qa-suite.yml's appium-tests job already solved
        # (see its identical step): Appium's chromedriverAutodownload
        # capability only resolves against the newer Chrome-for-Testing
        # endpoint, which has no entries before Chrome 115 -- and the
        # api-level 33 google_apis image ships a stock Chrome 109.0.5414, so
        # autodownload silently finds nothing and every test fails with "No
        # Chromedriver found that can automate Chrome '109.0.5414'" (a real
        # CI run of this exact job hit precisely that). A matching driver
        # exists on the legacy chromedriver.storage.googleapis.com endpoint
        # -- fetch it explicitly and point Appium straight at it, same as
        # conftest.py's CHROMEDRIVER_EXECUTABLE support already expects.
        run: |
          curl -sL -o "${{ github.workspace }}/chromedriver-109.zip" https://chromedriver.storage.googleapis.com/109.0.5414.74/chromedriver_linux64.zip
          unzip -o "${{ github.workspace }}/chromedriver-109.zip" -d "${{ github.workspace }}/chromedriver-109"
          chmod +x "${{ github.workspace }}/chromedriver-109/chromedriver"

      - name: Start Appium server
        run: |
          nohup appium --log-timestamp > "${{ github.workspace }}/appium.log" 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/status >/dev/null && { echo "appium server up"; exit 0; }
            sleep 2
          done
          echo "appium server did not start in time"; cat "${{ github.workspace }}/appium.log"; exit 1

      - name: Run Appium suite against the installed APK on the emulator
        # continue-on-error at the step level only, same reasoning as
        # qa-suite.yml's appium-tests/selenium-tests: a handful of
        # failing/flaky tests must not abort the run before the threshold
        # check and artifact-upload steps below get to run. Apply Appium
        # pass-rate threshold below is what actually decides this job.
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: for i in $(seq 1 30); do adb shell service check settings 2>/dev/null | grep -q "found" && break; sleep 2; done; cd "${{ github.workspace }}/voiceguard/e2e/appium-android" && python -m pytest -v --reruns 1 --reruns-delay 3 --json-report --json-report-file="${{ github.workspace }}/voiceguard/e2e/results/appium_android_report.json" --junitxml="${{ github.workspace }}/voiceguard/e2e/results/appium_android_report.xml"
        env:
          APPIUM_SERVER_URL: http://127.0.0.1:4723
          VOICEGUARD_APK_PATH: ${{ github.workspace }}/voiceguard/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          CHROMEDRIVER_EXECUTABLE: ${{ github.workspace }}/chromedriver-109/chromedriver
        continue-on-error: true

      - name: Parse Appium results
        if: always()
        working-directory: voiceguard/e2e/appium-android
        env:
          ANDROID_API_LEVEL: "33"
          ANDROID_TARGET: google_apis
          ANDROID_ARCH: x86_64
          ANDROID_PROFILE: pixel_5
          APPIUM_VERSION: "3.6.0"
          UIAUTOMATOR2_DRIVER_VERSION: "8.2.2"
        run: python parse_results.py

      - name: Apply Appium Android pass-rate threshold
        if: always()
        working-directory: voiceguard/e2e/appium-android
        run: python check_pass_threshold.py

      - name: Upload Appium Android report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-android-report
          path: |
            voiceguard/e2e/results/appium_android_report.*
            voiceguard/e2e/results/appium_android_summary.json
            voiceguard/e2e/results/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Dump backend logs on failure
        if: failure()
        working-directory: voiceguard
        run: docker compose logs backend --tail 300

      - name: Tear down
        if: always()
        working-directory: voiceguard
        run: docker compose down -v

  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [build-apk-for-artifact, appium-android-tests]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report job statuses
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| build-apk-for-artifact | ${{ needs.build-apk-for-artifact.result }} |"
            echo "| appium-android-tests | ${{ needs.appium-android-tests.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if a blocking job did not succeed
        if: |
          needs.build-apk-for-artifact.result != 'success' ||
          needs.appium-android-tests.result != 'success'
        run: |
          echo "The Android build and/or its Appium gate did not succeed — see the status table above."
          exit 1
