# VoiceGuard — Product Foundation stack (postgres, redis, backend, frontend).
#
# This is separate from the root Dockerfile, which builds the Gradio HF Space
# demo (app.py) and is untouched by this slice. Run:
#   docker compose up --build
# Backend: http://localhost:8000/docs   Frontend: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceguard
      POSTGRES_USER: voiceguard
      POSTGRES_PASSWORD: voiceguard
    ports:
      - "5432:5432"
    volumes:
      - voiceguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceguard -d voiceguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real malware scanning for uploaded files (api.scans.malware_scan), spoken
  # to over ClamAV's documented INSTREAM protocol on port 3310 — a sidecar
  # service exactly like postgres/redis above, not bundled into the backend
  # image, so the served application image stays lean and the virus
  # signature database can be updated/persisted independently. `backend`
  # deliberately does NOT block its own startup on this service being fully
  # healthy (see the plain `depends_on: [clamav]` below, not a
  # `condition: service_healthy` gate): freshclam's first-boot signature
  # sync can take minutes, and api.scans.malware_scan already fails uploads
  # closed (MALWARE_SCAN_UNAVAILABLE, never silently "clean") for exactly as
  # long as clamd isn't ready yet — the same best-effort-at-boot,
  # clear-503-until-ready pattern api/main.py's own ML model load already
  # uses, deliberately reused here rather than inventing a second one.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - voiceguard_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build:
      context: .
      dockerfile: api/Dockerfile.ml
    env_file:
      - api/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceguard:voiceguard@postgres:5432/voiceguard
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Passed through from the host shell so load tests (and CI's
      # performance-smoke-test job) can raise the per-IP login limit for a
      # test run without editing .env — defaults to the real, secure value.
      # See security-review.md F-14: this can no longer be worked around via
      # a spoofed X-Forwarded-For header, so this is the supported knob.
      RATE_LIMIT_LOGIN_PER_HOUR_PER_IP: ${RATE_LIMIT_LOGIN_PER_HOUR_PER_IP:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data/uploads:/app/data/uploads

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - voiceguard_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  voiceguard_postgres_data:
  voiceguard_frontend_node_modules:
  voiceguard_clamav_data:
